server:
  host: "0.0.0.0"
  port: 8080

log:
  level: "debug"
  file: "./logs/aigis.log"
  # 日志滚动：默认关闭（单文件），交给系统 logrotate 处理。
  # 若不用 logrotate，设 rotate: true 启用内置 lumberjack 滚动。
  # 切勿同时用 logrotate + lumberjack 管同一文件（会互相冲突）。
  rotate: false
  # 下列参数仅在 rotate: true 时生效：
  max_size_mb: 100   # rotate when the file exceeds this size
  max_backups: 7     # keep at most this many rotated files
  max_age_days: 30   # delete rotated files older than this
  compress: true     # gzip rotated files

# Sensitive-info audit trail.
# When enabled, every request that masks sensitive info appends ONE metadata-only
# JSON line to ./logs/audit.jsonl (rule type + counts + placeholders, NO plaintext).
# Clean requests produce no line. Defaults to true if this section is omitted.
audit:
  enabled: true

# Admission control. max_concurrent caps the number of requests processed at
# once; excess requests get HTTP 429 (Too Many Requests). 0 = unlimited (default).
limit:
  max_concurrent: 0

# Per-route circuit breaker. When an upstream fails fail_threshold times in a
# row, that route's circuit opens and returns HTTP 503 for cooldown_sec; then it
# lets one probe through (half-open) and closes on success. Disabled by default.
breaker:
  enabled: false
  fail_threshold: 5
  cooldown_sec: 30

# Response cache (non-streaming only). Identical requests within ttl_sec return
# the previous response (X-Cache: HIT) instead of hitting the upstream. 0 =
# disabled (default). Best for deterministic / low-sensitivity workloads — the
# cache holds plaintext responses in memory, so keep ttl short.
cache:
  ttl_sec: 0
  max_entries: 1000

# Upstream retry (all routes). On a TRANSIENT failure — a network error, HTTP 429,
# or any 5xx — the gateway retries with a linear backoff (backoff_ms * attempt). A
# 4xx client error is returned immediately (a retry won't fix it). Disabled by
# default: max_attempts <= 1 means a single try (no retry).
retry:
  max_attempts: 1   # total tries incl. the first; set >1 to enable retry
  backoff_ms: 200   # base backoff; grows linearly per attempt

# Custom sensitive-info detection rules (optional). Each rule's pattern is a Go
# regexp; matches are tokenized (masked->vault->unmasked) exactly like the
# built-in rules (email/phone/keys). Invalid regex fails loud at startup.
# security:
#   custom_rules:
#     - name: "ID Card"          # 中国身份证（18 位）
#       pattern: '\b\d{17}[\dXx]\b'
#     - name: "Bank Card"
#       pattern: '\b\d{16,19}\b'

# Legacy OpenAI config (used as fallback if no engine.routes configured)
openai:
  api_key: ""
  base_url: "https://api.openai.com/v1"
  model: "gpt-3.5-turbo"

# Transformation Engine Configuration
# If routes are configured here, they take precedence over legacy openai config
engine:
  routes:
    # Default OpenAI route - matches all requests with gpt models
    - id: "openai-default"
      matcher:
        model: "^gpt-.*"  # Regex: matches gpt-3.5-turbo, gpt-4, etc.
      upstream:
        base_url: "https://aihubmix.com/v1"
        path: "/chat/completions"
        auth_strategy: "bearer"  # bearer, header, query
        token_env: "AIGIS_OPENAI_API_KEY"  # Environment variable name
        # token_envs — optional multi-key load balancing: list several env var
        # names and the gateway round-robins across the keys that resolve to a
        # non-empty value (env vars that are empty/unset are skipped). When set,
        # token_envs takes precedence over token_env above. Keys live only in the
        # environment, never in this file.
        # token_envs: ["AIGIS_OPENAI_API_KEY_1", "AIGIS_OPENAI_API_KEY_2"]
      transforms:
        - type: "pii"
          # config.email tunes email tokenization:
          #   (omitted)/"full" — tokenize the whole address (default, most strict)
          #   "local"          — tokenize only the local part, keep "@domain" so
          #                      the model still sees the domain. Unmask restores
          #                      the full address on the way back regardless.
          # config.rules — comma-separated rule names to apply on THIS route
          #   (e.g. "Email,Mobile Phone"); omit/empty = all rules. Built-in names:
          #   Private Key / AWS Access Key / OpenAI API Key / GitHub Token /
          #   Google API Key / Email / Mobile Phone (+ any custom_rules names).
          config: {}  # Uses default patterns (all rules, email: full)
        # Inbound guards (optional). Both are request-side transforms; a hit
        # aborts the request BEFORE it reaches the upstream (saves upstream cost).
        # - type: "guard"        # size / token budget pre-check
        #   config:
        #     max_bytes: "262144"  # reject bodies larger than 256 KiB (0/omit = off)
        #     max_tokens: "4096"   # reject if the request's max_tokens exceeds this
        # - type: "injection"    # prompt-injection / jailbreak detection
        #   config:
        #     mode: "block"        # "block" (default, hit -> 400) or "warn" (log only)
        #     # extra_patterns — route-scoped extra rules (JSON array of {name,pattern}):
        #     extra_patterns: '[{"name":"secret-word","pattern":"(?i)open sesame"}]'
    # Gemini route: Gemini models via an OpenAI-compatible aggregator endpoint
    # (e.g. aihubmix / inferera), so request/response stay in OpenAI shape — no
    # protocol translation needed (unlike Dify). Uses AIGIS_GEMINI_BASE_URL (/v1)
    # + GEMINI_API_KEY.
    - id: "gemini-default"
      matcher:
        model: "^gemini-.*"  # gemini-2.5-flash, gemini-2.0-flash, ...
      upstream:
        base_url: "env:AIGIS_GEMINI_BASE_URL"
        path: "/chat/completions"
        auth_strategy: "bearer"
        token_env: "GEMINI_API_KEY"
      transforms:
        - type: "pii"
          config: {}
    # ---------------------------------------------------------------------------
    # OpenAI-compatible providers (DeepSeek / Qwen / Moonshot-Kimi, ...)
    # These upstreams speak the OpenAI /chat/completions shape verbatim, so NO
    # protocol translation is needed — just point base_url at the vendor endpoint
    # and match the model prefix. PII masking applies exactly like the routes
    # above. Uncomment the ones you use and set the corresponding *_API_KEY env.
    # See the compatibility table in README for endpoints/model prefixes.
    # ---------------------------------------------------------------------------
    # - id: "deepseek"
    #   matcher:
    #     model: "^deepseek-.*"          # deepseek-chat, deepseek-reasoner, ...
    #   upstream:
    #     base_url: "https://api.deepseek.com/v1"
    #     path: "/chat/completions"
    #     auth_strategy: "bearer"
    #     token_env: "DEEPSEEK_API_KEY"
    #   transforms:
    #     - type: "pii"
    #       config: {}
    # - id: "qwen"
    #   matcher:
    #     model: "^qwen.*"               # qwen-max, qwen-plus, qwen3-*, ...
    #   upstream:
    #     # Alibaba DashScope OpenAI-compatible endpoint (intl); CN users may use
    #     # https://dashscope.aliyuncs.com/compatible-mode/v1
    #     base_url: "https://dashscope-intl.aliyuncs.com/compatible-mode/v1"
    #     path: "/chat/completions"
    #     auth_strategy: "bearer"
    #     token_env: "DASHSCOPE_API_KEY"
    #   transforms:
    #     - type: "pii"
    #       config: {}
    # - id: "moonshot-kimi"
    #   matcher:
    #     model: "^(moonshot|kimi).*"    # kimi-k2, moonshot-v1-*, ...
    #   upstream:
    #     # Global endpoint; CN users may use https://api.moonshot.cn/v1
    #     base_url: "https://api.moonshot.ai/v1"
    #     path: "/chat/completions"
    #     auth_strategy: "bearer"
    #     token_env: "MOONSHOT_API_KEY"
    #   transforms:
    #     - type: "pii"
    #       config: {}
    # ---------------------------------------------------------------------------
    # Azure OpenAI (legacy /openai/deployments 端点)。与原生 OpenAI 两点不同：
    #   1) api-version 走 query，直接拼进 path(url = base_url + path，透传);
    #   2) 鉴权用 api-key 请求头(非 Bearer)，故 auth_strategy: header + header_name。
    # base_url 用你的资源域名，path 里的 deployment 名替换成你的部署(如 gpt-4o)。
    # KEY 绝不写进本文件——只经 env:AIGIS_AZURE_KEY 注入。
    # - id: "azure-openai"
    #   matcher:
    #     model: "^azure-.*"             # 客户端用 azure-gpt-4o 之类的 model 名
    #   upstream:
    #     base_url: "https://<resource>.openai.azure.com"  # 或 env:AIGIS_AZURE_BASE_URL
    #     path: "/openai/deployments/gpt-4o/chat/completions?api-version=2024-12-01-preview"
    #     auth_strategy: "header"
    #     header_name: "api-key"
    #     token_env: "AIGIS_AZURE_KEY"
    #   transforms:
    #     - type: "pii"
    #       config: {}
    # Anthropic 原生 /v1/messages：与 OpenAI 协议不同——鉴权走 x-api-key 头(非
    # Bearer)、需带 anthropic-version 头。用 auth_strategy: none + header_policy
    # 精确设头即可，无需核心改动。base_url 指官方 https://api.anthropic.com/v1
    # 或你的中转地址；path 为 /messages。pii_claude 按 messages 结构脱敏。
    - id: "claude-proxy"
      matcher:
        model: "^(claude|glm).*"
      upstream:
        base_url: "env:AIGIS_ANTHROPIC_BASE_URL" # 或者你的中转地址
        path: "/messages"
        # 注意：Claude 不使用 Bearer Token，而是 header 里的 x-api-key
        # 所以这里 auth_strategy 设为 none，我们用 header_policy 来处理
        auth_strategy: "none" 
      
      header_policy:
        allow: ["anthropic-version", "content-type", "anthropic-beta"]
        set:
          "x-api-key": "env:AIGIS_ANTHROPIC_KEY" # 你的真实 Key
        remove: ["authorization"] # 移除可能误传的 Bearer

      transforms:
        - type: "pii_claude"
          config: {}
    # Dify chat route: translates an OpenAI-style chat request into Dify's
    # /chat-messages payload (chat/agent/chatflow app). PII is masked first, then
    # the body is reshaped by the template. Uses AIGIS_DIFY_BASE_URL / AIGIS_DIFY_API_KEY.
    # NOTE: for a Workflow-type app use path "/workflows/run" and put the query
    # under "inputs"; for a Completion app use "/completion-messages".
    # NOTE: the `json` template func quotes+escapes the value, so do NOT wrap the
    # {{json ...}} call in literal quotes — it already emits a JSON string.
    - id: "dify-workflow"
      matcher:
        model: "^dify-.*"
      upstream:
        base_url: "env:AIGIS_DIFY_BASE_URL"
        path: "/chat-messages"
        auth_strategy: "bearer"
        token_env: "AIGIS_DIFY_API_KEY"
      transforms:
        - type: "pii"
          config:
            email: "local"  # keep @domain visible to dify, tokenize only the mailbox
        - type: "template"
          config:
            # response_mode follows the client's "stream" flag: streaming when the
            # client wants SSE (translated back by stream_translate below), else
            # blocking (translated by response_transforms below).
            template: |
              {
                "inputs": {},
                "query": {{json (index .messages 0 "content")}},
                "response_mode": {{if .stream}}"streaming"{{else}}"blocking"{{end}},
                "user": {{json .user}}
              }
      # 流式响应翻译：dify SSE 事件流 -> OpenAI chat.completion.chunk 流
      stream_translate: "dify"
      # 非流式响应转换：把 dify 原生响应翻译回 OpenAI chat-completion 形态
      response_transforms:
        - type: "template"
          config:
            template: |
              {
                "id": {{json .message_id}},
                "object": "chat.completion",
                "created": {{json .created_at}},
                "model": "dify",
                "choices": [
                  {
                    "index": 0,
                    "message": {"role": "assistant", "content": {{json .answer}}},
                    "finish_reason": "stop"
                  }
                ],
                "usage": {{json .metadata.usage}}
              }

    # Example: Field mapping transform (commented out)
    # - id: "custom-api"
    #   matcher:
    #     model: "^custom-.*"
    #   upstream:
    #     base_url: "https://custom-api.example.com"
    #     path: "/generate"
    #     auth_strategy: "header"
    #     header_name: "X-API-Key"
    #     token_env: "CUSTOM_API_KEY"
    #   transforms:
    #     - type: "field_map"
    #       config:
    #         "prompt": "messages.0.content"  # target: source
    #         "max_tokens": "max_tokens"

    # Catch-all route (matches everything, should be last)
    - id: "fallback"
      matcher: {}  # Empty matcher = matches all
      upstream:
        base_url: "https://api.openai.com/v1"
        path: "/chat/completions"
        auth_strategy: "bearer"
        token_env: "OPENAI_API_KEY"
      transforms:
        - type: "pii"
          config: {}
