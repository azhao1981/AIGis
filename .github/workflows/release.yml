name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="aigis"
          if [ "${GOOS}" = "windows" ]; then OUT="aigis.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${OUT}" ./cmd/aigis

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="aigis_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist"
          cp README.md LICENSE configs/config.yaml . 2>/dev/null || true
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "dist/${NAME}.zip" aigis.exe README.md LICENSE
          else
            tar -czf "dist/${NAME}.tar.gz" aigis README.md LICENSE
          fi

      - name: Checksums
        run: |
          cd dist
          sha256sum * > "SHA256SUMS_${{ matrix.goos }}_${{ matrix.goarch }}.txt"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
