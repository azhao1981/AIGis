name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}"
          OUT="aigis"
          if [ "${GOOS}" = "windows" ]; then OUT="aigis.exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "${OUT}" ./cmd/aigis

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NAME="aigis_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "dist"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "dist/${NAME}.zip" aigis.exe README.md LICENSE
          else
            tar -czf "dist/${NAME}.tar.gz" aigis README.md LICENSE
          fi
          cd dist
          sha256sum * > "SHA256SUMS_${{ matrix.goos }}_${{ matrix.goarch }}.part"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          retention-days: 1

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Merge checksums
        run: |
          cd dist
          cat *.part | sort -k2 > SHA256SUMS && rm -f *.part

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
